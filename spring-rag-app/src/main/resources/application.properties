spring.application.name=spring-rag-app
server.port=8082

# ── Google GenAI (Gemini) Configuration ──
# Set the GEMINI_API_KEY environment variable before starting the app to enable answers.
# A non-blank placeholder is used by default so the app still boots and serves the UI /
# document upload without a key; queries then return a clear "configure your key" error.
spring.ai.google.genai.api-key=${GEMINI_API_KEY:not-configured}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
spring.ai.google.genai.chat.options.temperature=0.2

# ── ONNX Local Embeddings (custom bean in AiConfig, no DJL engine required) ──
spring.ai.embedding.transformer.enabled=false
# Allow our @Primary custom embeddingModel bean to override the auto-configured one
spring.main.allow-bean-definition-overriding=true
# Disable Google GenAI embedding model auto-config (we use ONNX locally, not text-embedding-004)
spring.ai.google.genai.embedding.enabled=false
# ONNX model URIs — overridable via -D system properties in Docker/Render for offline use
rag.onnx.tokenizer-uri=https://raw.githubusercontent.com/spring-projects/spring-ai/main/models/spring-ai-transformers/src/main/resources/onnx/all-MiniLM-L6-v2/tokenizer.json
rag.onnx.model-uri=https://media.githubusercontent.com/media/spring-projects/spring-ai/refs/heads/main/models/spring-ai-transformers/src/main/resources/onnx/all-MiniLM-L6-v2/model.onnx

# ── Spring AI Retry — disable retries to avoid burning quota on errors ──
# Default is 10 attempts — a single failed query could make 10 Gemini API calls
spring.ai.retry.max-attempts=1
spring.ai.retry.on-client-errors=false

# ── JWT Configuration ──
# A random dev-only default is provided so the app runs out of the box.
# ALWAYS override JWT_SECRET (Base64, >=256-bit) in any real deployment.
app.jwt.secret=${JWT_SECRET:NcJu9uajw+Z0w0s4A5F7VYnc8xH9NPeJ+2N3tgOLy9lDeNon75R721/nzcR2y4Wa}
app.jwt.expiration-ms=3600000

# ── File Upload Configuration ──
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Document Chunking ──
app.rag.chunk-size=800
app.rag.chunk-overlap=100
app.rag.top-k=4

# ── Library Persistence (survives restarts) ──
# When enabled, the vector store + document registry are saved to disk after each
# upload and restored on startup, so uploaded documents are not lost on restart.
# Point the dir at a mounted volume in containers (e.g. /app/data).
app.rag.persistence.enabled=true
app.rag.persistence.dir=./data

# ── Chat History (Conversational Memory) ──
app.rag.chat-history.max-turns=5
app.rag.chat-history.ttl-minutes=30

# ── Actuator ──
management.endpoints.web.exposure.include=health,info,metrics,env,beans,mappings,loggers,heapdump
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always
management.info.env.enabled=true
info.app.name=Spring RAG App
info.app.description=RAG application using Gemini 2.5 Flash + ONNX all-MiniLM-L6-v2
info.app.version=0.0.1-SNAPSHOT
