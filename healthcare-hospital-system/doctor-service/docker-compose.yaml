services:
  doctor-service:
    build: .
    container_name: doctor-service
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/doctor_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
    - "8490:8490"
    - "9092:9092"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - doctor-service-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8490/actuator/health || exit 1"]
      interval: 1m30s
      timeout: 30s
      retries: 3
      start_period: 15s
    
  mysql:
    image: mysql:8.0
    container_name: doctor-database
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: doctor_db
      MYSQL_USER: doctor_user
      MYSQL_PASSWORD: doctor_pass
    ports:
      - "3310:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-script:/docker-entrypoint-initdb.d
    networks:
      - doctor-service-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
  
  redis:
    image: redis:alpine
    container_name: doctor-service-redis
    ports:
      - "6372:6379"
    networks:
      - doctor-service-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  doctor-service-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local