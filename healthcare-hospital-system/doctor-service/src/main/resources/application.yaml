server:
  port: 8490

spring:
  application:
    name: doctor-service
  datasource:
    url: jdbc:mysql://localhost:3306/doctor_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: doctor_user
    password: doctor_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost      # overridden to 'redis' in Docker via env var
      port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 300000



grpc:
  server:
    port: 9092   # gRPC server port — separate from HTTP port (8490)

    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: doctor-service
    description: Manages doctor profile data for healthcare appointment system
    version: 1.0.0

logging:
  level:
    root: INFO