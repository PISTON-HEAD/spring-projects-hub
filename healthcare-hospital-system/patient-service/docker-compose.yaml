services:
  patient-service:
    build: .
    container_name: patient-service
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/patient_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
    - "8481:8481"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - patient-database-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8481/actuator/health || exit 1"]
      interval: 1m30s
      timeout: 30s
      retries: 3
      start_period: 15s
  
  mysql:
    image: mysql:8.0
    container_name: patient-database
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: patient_db
      MYSQL_USER: patient_user
      MYSQL_PASSWORD: patient_pass
    ports:
      - "3309:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - patient-database-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 30s
      retries: 3
    
networks:
  patient-database-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local