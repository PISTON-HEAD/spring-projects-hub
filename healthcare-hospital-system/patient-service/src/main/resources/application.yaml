server:
  port: 8481

spring:
  application:
    name: patient-service

  datasource:
    url: jdbc:mysql://localhost:3306/patient_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: patient_user
    password: patient_pass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      

  cache:
    type: redis
    redis:
      time-to-live: 300000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

grpc:
  server:
    port: 9091   # gRPC server port — separate from HTTP port (8481)

logging:
  level:
    root: INFO